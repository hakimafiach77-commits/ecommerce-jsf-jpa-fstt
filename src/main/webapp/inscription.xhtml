<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/WEB-INF/templates/layout.xhtml">

    <ui:define name="title">Inscription Internaute — AtlasTech Store</ui:define>

    <ui:define name="content">

        <div style="max-width: 680px; margin: 12px auto;">
            <div class="panel">
                <h1 class="panel-title">Créer un compte Internaute</h1>
                <p class="panel-sub">
                    Inscrivez-vous gratuitement pour enregistrer votre panier en base de données MySQL et commander en ligne.
                </p>

                <h:form>
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label">Nom *</label>
                            <h:inputText value="#{internauteBean.nouvelInternaute.nom}" styleClass="form-control"
                                         required="true" requiredMessage="Le nom est obligatoire."/>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Prénom *</label>
                            <h:inputText value="#{internauteBean.nouvelInternaute.prenom}" styleClass="form-control"
                                         required="true" requiredMessage="Le prénom est obligatoire."/>
                        </div>
                    </div>

                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label">Adresse e-mail *</label>
                            <h:inputText value="#{internauteBean.nouvelInternaute.email}" styleClass="form-control"
                                         required="true" requiredMessage="L'adresse e-mail est obligatoire.">
                                <f:passThroughAttribute name="type" value="email"/>
                            </h:inputText>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Téléphone</label>
                            <h:inputText value="#{internauteBean.nouvelInternaute.telephone}" styleClass="form-control">
                                <f:passThroughAttribute name="placeholder" value="+212 6 ..."/>
                            </h:inputText>
                        </div>
                    </div>

                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label">Ville *</label>
                            <h:inputText value="#{internauteBean.nouvelInternaute.ville}" styleClass="form-control"
                                         required="true" requiredMessage="La ville est obligatoire.">
                                <f:passThroughAttribute name="placeholder" value="ex: Tanger"/>
                            </h:inputText>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Adresse complète *</label>
                            <h:inputText value="#{internauteBean.nouvelInternaute.adresse}" styleClass="form-control"
                                         required="true" requiredMessage="L'adresse est obligatoire."/>
                        </div>
                    </div>

                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label">Mot de passe (min. 6 caractères) *</label>
                            <h:inputSecret value="#{internauteBean.motDePasseInscription}" styleClass="form-control"
                                           required="true" requiredMessage="Veuillez choisir un mot de passe."/>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Confirmer le mot de passe *</label>
                            <h:inputSecret value="#{internauteBean.confirmationMotDePasse}" styleClass="form-control"
                                           required="true" requiredMessage="Veuillez confirmer le mot de passe."/>
                        </div>
                    </div>

                    <h:commandButton value="Valider mon inscription"
                                     action="#{internauteBean.inscrire}"
                                     styleClass="btn btn-primary btn-block"
                                     style="padding: 12px; margin-top: 8px;"/>
                </h:form>

                <div style="text-align: center; margin-top: 16px; font-size: 0.9rem;">
                    Vous disposez déjà d'un compte ?
                    <h:link outcome="/connexion" value="Se connecter" style="font-weight: 700;"/>
                </div>
            </div>
        </div>

    </ui:define>
</ui:composition>
