<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/WEB-INF/templates/layout.xhtml">

    <ui:define name="title">Connexion Internaute — AtlasTech Store</ui:define>

    <ui:define name="content">

        <div class="auth-wrapper">
            <div class="panel">
                <h1 class="panel-title">Connexion à votre espace Internaute</h1>
                <p class="panel-sub">
                    Accédez à votre panier sauvegardé, suivez vos commandes et gérez votre profil.
                </p>

                <h:form>
                    <div class="form-group">
                        <label class="form-label">Adresse e-mail *</label>
                        <h:inputText value="#{internauteBean.emailConnexion}" styleClass="form-control" required="true"
                                     requiredMessage="Veuillez saisir votre adresse e-mail.">
                            <f:passThroughAttribute name="placeholder" value="ex: client@fstt.ac.ma"/>
                        </h:inputText>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Mot de passe *</label>
                        <h:inputSecret value="#{internauteBean.motDePasseConnexion}" styleClass="form-control" required="true"
                                       requiredMessage="Veuillez saisir votre mot de passe."/>
                    </div>

                    <h:commandButton value="Se connecter"
                                     action="#{internauteBean.seConnecter}"
                                     styleClass="btn btn-primary btn-block"
                                     style="padding: 11px; margin-top: 6px;"/>
                </h:form>

                <!-- Connexion rapide Démo (1 clic) -->
                <div class="demo-box">
                    <div style="font-size: 0.82rem; font-weight: 800; color: #334155; margin-bottom: 8px; text-transform: uppercase;">
                        Comptes de démonstration pré-configurés (1 clic)
                    </div>
                    <h:form style="display: flex; gap: 10px; flex-wrap: wrap;">
                        <h:commandButton value="Client Démo (client@fstt.ac.ma)"
                                         action="#{internauteBean.connexionRapideClient}"
                                         styleClass="btn btn-outline btn-sm flex-1"/>
                        <h:commandButton value="Admin Catalogue (admin@fstt.ac.ma)"
                                         action="#{internauteBean.connexionRapideAdmin}"
                                         styleClass="btn btn-accent btn-sm flex-1"/>
                    </h:form>
                </div>

                <div style="text-align: center; margin-top: 18px; font-size: 0.9rem;">
                    Nouveau sur AtlasTech Store ?
                    <h:link outcome="/inscription" value="Créer un compte Internaute" style="font-weight: 700;"/>
                </div>
            </div>
        </div>

    </ui:define>
</ui:composition>
